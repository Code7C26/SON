    (function () {

        const s = BASE * z;
        let x = VW / 2 - cx * s, y = VH / 2 - cy * s;

        tl.to("#rs-cursor", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, t);
