<template>
  <style>
    @font-face { font-family: "Plus Jakarta Sans"; src: url("assets/fonts/PlusJakartaSans-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("assets/fonts/PlusJakartaSans-Bold.ttf"); font-weight: 700; }
    #root { position: absolute; inset: 0; background: #f4f4f4; overflow: hidden; font-family: "Plus Jakarta Sans", sans-serif; }
    #cierre-tinta { position: absolute; inset: 0; background: #2e2e2e; }
    .linea { position: absolute; left: 200px; top: 440px; font-size: 132px; font-weight: 400; letter-spacing: -3px; color: #f4f4f4; white-space: nowrap; }
    .linea .t { position: relative; display: inline-block; }
    .linea .raya { position: absolute; left: -8px; right: -8px; top: 54%; height: 8px; border-radius: 4px; background: #b3b3b3; transform-origin: 0 50%; }
    #cierre-acto { position: absolute; left: 200px; top: 440px; font-size: 132px; font-weight: 700; letter-spacing: -3px; color: #ff6147; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="cierre" data-width="1920" data-height="1080">
    <div id="cierre-tinta"></div>
    <div id="cierre-l1" class="linea"><span class="t">Planillas en papel<i class="raya"></i></span></div>
    <div id="cierre-l2" class="linea"><span class="t">Pasar en limpio<i class="raya"></i></span></div>
    <div id="cierre-l3" class="linea"><span class="t">Varios días<i class="raya"></i></span></div>
    <div id="cierre-acto">En el acto</div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Inundación de tinta desde el centro
      tl.fromTo("#cierre-tinta", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: 0.45, ease: "power2.inOut" }, 0);
      const linea = (id, tIn, tRaya, tOut) => {
        tl.fromTo(id + " .t", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, tIn);
        tl.fromTo(id + " .raya", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, tRaya);
        tl.to(id + " .t", { color: "#9a9a9a", duration: 0.25 }, tRaya + 0.1);
        if (tOut) tl.to(id + " .t", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, tOut);
      };
      // «papeles» 0.81 · «limpio» 3.13 · «días» 5.34
      linea("#cierre-l1", 0.55, 1.3, 2.4);
      linea("#cierre-l2", 2.5, 2.8, 3.7);
      linea("#cierre-l3", 3.85, 4.12, null);
      // «Varios días» rueda a «En el acto» justo cuando la voz dice «en el acto» (46.24 → 6.64 local)
      tl.to("#cierre-l3", { yPercent: -60, opacity: 0, duration: 0.22, ease: "power2.in" }, 6.5);
      tl.fromTo("#cierre-acto", { yPercent: 60, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 6.6);
      // Sale antes del corte a la marca
      tl.to("#cierre-acto", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 8.35);
      window.__timelines["cierre"] = tl;
    })();
  </script>
</template>
