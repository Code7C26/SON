    (function () {
      const tl = gsap.timeline({ paused: true });

        const s = BASE * z;
        let x = VW / 2 - cx * s, y = VH / 2 - cy * s;
        x = Math.min(0, Math.max(VW - 1920 * s, x));
        y = Math.min(0, Math.max(VH - 1080 * s, y));
        tl.to("#pn-lienzo", { x, y, scale: s, duration: d || 0.9, ease: "power2.inOut" }, t);
      }
      const ver = (t, id) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "none" }, t);
      const mover = (t, x, y, d) => tl.to("#pn-cursor", { x, y, duration: d || 0.6, ease: "power2.inOut" }, t);
      function clic(t, x, y) {
        tl.to("#pn-cursor", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, t);
        tl.fromTo("#pn-onda", { x: x - 40, y: y - 40, scale: 0.2, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out" }, t);
      }
      function anillo(t, id, x, y, w, h, dur) {
        gsap.set(id, { left: x - 10, top: y - 10, width: w + 20, height: h + 20 });
        tl.fromTo(id, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, t);
        tl.to(id, { opacity: 0, duration: 0.25, ease: "none" }, t + dur);
      }
      function rotulo(t, id, dur) {
        tl.fromTo(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power4.out" }, t);
        tl.to(id, { opacity: 0, x: 12, duration: 0.25, ease: "power2.in" }, t + dur);
      }

      // Entrada del navegador
      tl.fromTo("#pn-nav", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 0);

      // Ingreso
      rotulo(0.4, "#pn-r1", 2.2);
      mover(0.5, 1440, 525); clic(1.15, 1440, 525); ver(1.3, "#pn-c02");
