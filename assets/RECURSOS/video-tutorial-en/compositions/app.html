  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const BASE = 400 / 975, VW = 400, VH = 2110 * BASE;
      gsap.set("#ap-lienzo", { x: 0, y: 0, scale: BASE });

      function cam(t, cx, cy, z, d) {
        const s = BASE * z;
        let x = VW / 2 - cx * s, y = VH / 2 - cy * s;
        x = Math.min(0, Math.max(VW - 975 * s, x));
        y = Math.min(0, Math.max(VH - 2110 * s, y));
        tl.to("#ap-lienzo", { x, y, scale: s, duration: d || 0.9, ease: "power2.inOut" }, t);
      }
      const ver = (t, id) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "none" }, t);
      // Toque: el dedo aparece, aprieta y se va
      function toque(t, x, y) {
        tl.fromTo("#ap-dedo", { x: x - 60, y: y - 60, scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" }, t - 0.2);
        tl.fromTo("#ap-onda", { x: x - 60, y: y - 60, scale: 0.4, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.5, ease: "power2.out" }, t);
        tl.to("#ap-dedo", { opacity: 0, duration: 0.2, ease: "none" }, t + 0.15);
      }
      function anillo(t, id, x, y, w, h, dur) {
        gsap.set(id, { left: x - 16, top: y - 16, width: w + 32, height: h + 32 });
        tl.fromTo(id, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, t);
        tl.to(id, { opacity: 0, duration: 0.25, ease: "none" }, t + dur);
      }
      // Palabra-paso: entra con desenfoque y se va igual
      function paso(t, id, hasta) {
        tl.fromTo(id, { opacity: 0, filter: "blur(10px)", x: -20 }, { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.45, ease: "power3.out" }, t);
        tl.to(id, { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, hasta - 0.25);
      }

      // Entrada: el celular llega desde la derecha
      tl.fromTo("#ap-tel", { x: 380, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0);
      tl.fromTo("#ap-n1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power4.out" }, 0.2);
      tl.to("#ap-n1", { opacity: 0, duration: 0.3 }, 39.3);

      // Jornada → orden → Iniciar trabajo
      paso(0.3, "#ap-p1", 8.2);
      anillo(1.4, "#ap-a1", 42, 1372, 892, 287, 2.0);
      toque(3.7, 485, 1515); ver(3.9, "#ap-c02");
      anillo(4.2, "#ap-a2", 40, 1910, 895, 140, 0.75);
      toque(5.0, 485, 1978); ver(5.2, "#ap-c03");

      // Check-in GPS
      paso(8.2, "#ap-p2", 16.9);
      ver(8.4, "#ap-c04");
      cam(9.0, 400, 1180, 1.35, 1.0);
      anillo(10.0, "#ap-a3", 42, 1078, 892, 373, 2.4);
      cam(12.9, 487, 1600, 1.3, 0.9);
      anillo(13.7, "#ap-a4", 38, 1780, 900, 112, 1.8);
      cam(15.9, 487, 1055, 1, 0.8);

      // Checklist
      paso(16.9, "#ap-p3", 21.7);
      toque(17.6, 132, 480); ver(17.8, "#ap-c05");
      toque(18.9, 132, 840); ver(19.1, "#ap-c06");
      anillo(19.6, "#ap-a5", 42, 418, 892, 482, 1.6);
      toque(21.5, 485, 2008); ver(21.7, "#ap-c07");

      // Fotos
      paso(21.7, "#ap-p4", 26.9);
      toque(23.0, 183, 558); ver(23.4, "#ap-c08");
      toque(24.6, 183, 558); ver(25.0, "#ap-c09");
      anillo(25.3, "#ap-a6", 40, 415, 600, 287, 1.3);
      toque(26.9, 570, 2008); ver(27.1, "#ap-c10");

      // Notas
      paso(26.9, "#ap-p5", 30.6);
      toque(27.9, 485, 530); ver(28.3, "#ap-c11");
      anillo(28.6, "#ap-a7", 42, 418, 892, 236, 1.6);
      toque(30.5, 570, 2008); ver(30.7, "#ap-c12");

      // Firmas: la firma del técnico se dibuja, después la del cliente
      paso(30.6, "#ap-p6", 37.2);
      toque(31.5, 485, 615); ver(31.75, "#ap-c13");
      tl.fromTo("#ap-c14", { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.2, ease: "power1.inOut" }, 32.2);
      toque(33.7, 485, 2000); ver(33.95, "#ap-c15");
      toque(34.6, 485, 1190); ver(34.85, "#ap-c16");
      toque(35.7, 485, 2000); ver(35.95, "#ap-c17");
      toque(36.8, 572, 2008); ver(37.05, "#ap-c18");

      // Visita finalizada: el informe se guarda y se envía solo
      paso(37.2, "#ap-p7", 39.9);
      anillo(37.6, "#ap-a8", 38, 1625, 900, 250, 1.8);

      // Salida
      tl.to("#ap-tel", { x: 420, opacity: 0, duration: 0.4, ease: "power3.in" }, 39.6);

      window.__timelines["app"] = tl;
    })();
  </script>
