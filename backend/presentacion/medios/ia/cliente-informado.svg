    <rect x="82" y="28" width="150" height="10" rx="5" fill="#2E2E2E"/>
    <rect x="82" y="50" width="110" height="9" rx="4" fill="#9A9A9A"/>
  </g>
  <g transform="translate(610 262)">
    <rect width="250" height="88" rx="22" fill="#F4F4F4"/>
    <circle cx="44" cy="44" r="24" fill="#D99C13"/>
    <path d="M34 44 l7 7 l13 -14" stroke="#2E2E2E" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="82" y="28" width="130" height="10" rx="5" fill="#2E2E2E"/>
    <rect x="82" y="50" width="90" height="9" rx="4" fill="#9A9A9A"/>
  </g>

  <!-- Persona con celular -->
  <g transform="translate(200 360)">
