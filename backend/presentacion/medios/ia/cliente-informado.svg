    <path d="M40 520 Q50 330 200 300 Q350 330 360 520 Z" fill="#6E6E6E"/>
    <path d="M170 304 L200 360 L230 304 Z" fill="#F4F4F4"/>
    <path d="M196 340 L190 430 L200 445 L210 430 L204 340 Z" fill="#FF6147"/>
    <!-- cuello y cabeza -->
    <rect x="178" y="236" width="44" height="72" rx="16" fill="#D5D5D5"/>
    <circle cx="200" cy="200" r="68" fill="#D5D5D5"/>
    <path d="M132 196 Q130 120 200 116 Q270 120 268 196 Q250 156 200 152 Q150 156 132 196 Z" fill="#4C4C4C"/>
    <!-- brazo con celular -->
    <path d="M330 380 Q380 420 330 480 L280 470 Q300 440 290 410 Z" fill="#6E6E6E"/>
    <path d="M300 470 Q300 410 266 380 L250 400 Q272 430 270 470 Z" fill="#6E6E6E"/>
    <g transform="translate(232 300) rotate(-12)">
      <rect width="104" height="190" rx="18" fill="#262626"/>
      <rect x="8" y="12" width="88" height="166" rx="10" fill="#F4F4F4"/>
      <rect x="8" y="12" width="88" height="34" rx="10" fill="#FF6147"/>
      <rect x="20" y="24" width="44" height="9" rx="4" fill="#F4F4F4"/>
      <rect x="22" y="60" width="60" height="78" rx="6" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="2"/>
      <rect x="30" y="70" width="34" height="6" rx="3" fill="#2E2E2E"/>
      <rect x="30" y="84" width="44" height="5" rx="2" fill="#B3B3B3"/>
      <rect x="30" y="95" width="40" height="5" rx="2" fill="#B3B3B3"/>
      <rect x="30" y="106" width="44" height="5" rx="2" fill="#B3B3B3"/>
      <rect x="30" y="120" width="22" height="10" rx="3" fill="#FF6147"/>
      <rect x="22" y="148" width="60" height="18" rx="9" fill="#2E2E2E"/>
