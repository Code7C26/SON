<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <title>Cliente revisando en el celular el informe de la visita</title>
  <defs>
    <radialGradient id="brillo" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#FF6147" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF6147" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="#2E2E2E"/>
  <rect width="900" height="1200" fill="url(#brillo)"/>

  <!-- Nave industrial -->
  <path d="M60 640 V300 L330 170 L600 300 V640 Z" fill="#353535"/>
  <path d="M60 300 L330 170 L600 300" stroke="#4C4C4C" stroke-width="10" fill="none"/>
  <rect x="200" y="380" width="260" height="260" fill="#3F3F3F"/>
  <path d="M200 412 H460 M200 444 H460 M200 476 H460 M200 508 H460 M200 540 H460 M200 572 H460 M200 604 H460" stroke="#4C4C4C" stroke-width="4"/>
  <rect x="90" y="330" width="70" height="44" rx="4" fill="#D99C13" opacity="0.5"/>
  <rect x="500" y="330" width="70" height="44" rx="4" fill="#D99C13" opacity="0.35"/>
  <rect y="640" width="900" height="560" fill="#262626"/>

  <!-- Notificaciones flotando -->
  <g transform="translate(560 150)">
    <rect width="300" height="88" rx="22" fill="#F4F4F4"/>
