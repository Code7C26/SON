      tl.to("#campo-iniciar", { scale: 1, duration: 0.15 }, 4.2);
      tl.to("#campo-ini-a", { opacity: 0, duration: 0.1 }, 4.2);
      tl.to("#campo-ini-b", { opacity: 1, duration: 0.1 }, 4.25);

      // «sitio» (25.41 → 5.81): pantalla de trabajo, mapa con pin, «Check-in registrado»
      swapOut("#campo-s2", 5.4);
      swapIn("#campo-s3", 5.5);
      tl.fromTo("#campo-pin", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "bounce.out" }, 5.7);
      tl.fromTo("#campo-radio", { scale: 0, transformOrigin: "225px 168px" }, { scale: 1, duration: 0.5, ease: "expo.out" }, 5.85);
      tl.fromTo("#campo-snack", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 5.85);
      tl.to("#campo-snack", { opacity: 0, duration: 0.2 }, 7.1);
      // Cámara: empuje al mapa y vuelta
      tl.fromTo("#campo-tel", { scale: 1, transformOrigin: "50% 70%" }, { scale: 1.22, duration: 0.6, ease: "power2.inOut" }, 5.6);
      tl.to("#campo-tel", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 6.8);

      // Reloj de la visita
      const reloj = { s: 0 };
      tl.fromTo(reloj, { s: 0 }, { s: 382, duration: 6.5, ease: "none", onUpdate: () => {
        const s = Math.floor(reloj.s), m = Math.floor(s / 60);
        const el = document.querySelector("#campo-tiempo");
        if (el) el.textContent = "00:" + String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      } }, 5.5);

      // «checklist» (27.14 → 7.54): tres tildes
      pasoFuera("#campo-p2", 7.1);
      paso("#campo-p3", 7.3);
      const nums = gsap.utils.toArray("#campo-tareas .campo-n");
      const cajas = gsap.utils.toArray("#campo-tareas .caja");
      cajas.forEach((c, i) => {
        const t = 7.5 + i * 0.3;
        tl.fromTo(c.querySelector(".lleno"), { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.2)" }, t);
        tl.fromTo(c.querySelector("svg"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, t + 0.08);
        tl.fromTo(c.parentElement.querySelector(".tachado"), { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, t + 0.08);
        tl.to(c.parentElement, { color: "#6e6e6e", duration: 0.2 }, t + 0.08);
        tl.set(nums[i], { opacity: 0 }, t + 0.1);
        tl.set(nums[i + 1], { opacity: 1 }, t + 0.1);
      });

      // Paso Evidencia: «fotos» (28.45 → 8.85)
      toque(256, 939, 8.45);
      swapOut("#campo-tareas", 8.5);
      swapIn("#campo-evid", 8.55);
      const ok = { color: "#6e6e6e", borderTopColor: "#2e2e2e" };
      const on = { color: "#2e2e2e", borderTopColor: "#ff6147" };
      tl.set("#campo-t1", ok, 8.55);
      tl.set("#campo-t2", on, 8.55);
      ["#campo-f1", "#campo-f2", "#campo-f3"].forEach((f, i) => {
        tl.fromTo(f, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 8.85 + i * 0.18);
      });

      // Paso Firmas: «firma» (30.01 → 10.41)
      pasoFuera("#campo-p3", 9.5);
      paso("#campo-p4", 9.75);
      toque(256, 939, 9.6);
      swapOut("#campo-evid", 9.65);
      swapIn("#campo-firmas", 9.7);
      tl.set(["#campo-t2", "#campo-t3"], ok, 9.7);
      tl.set("#campo-t4", on, 9.7);
      tl.to("#campo-sig", { opacity: 0, duration: 0.15 }, 9.7);
      tl.to("#campo-fin", { opacity: 1, duration: 0.2 }, 9.75);
      tl.to("#campo-tel", { scale: 1.2, transformOrigin: "50% 55%", duration: 0.6, ease: "power2.inOut" }, 9.8);
      tl.to("#campo-tocar", { opacity: 0, duration: 0.15 }, 9.95);
      const trazo = document.querySelector("#campo-trazo");
      const L = trazo.getTotalLength();
      trazo.style.strokeDasharray = L;
      tl.fromTo(trazo, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.85, ease: "power1.inOut" }, 10.0);
      tl.to("#campo-caja-firma", { borderColor: "#ff6147", duration: 0.2 }, 10.85);
      tl.to("#campo-tel", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 11.1);

      // «Finalizar» (31.25 → 11.65)
      toque(256, 939, 11.65);
      tl.to("#campo-fin", { scale: 0.96, duration: 0.08 }, 11.65);
      tl.to("#campo-fin", { scale: 1, duration: 0.12 }, 11.73);
      pasoFuera("#campo-p4", 11.7);
      // La pantalla se vacía: el informe nace de ella en la escena siguiente
      tl.to(["#campo-s3", ".estado"], { opacity: 0, duration: 0.18, ease: "power2.in" }, 11.8);

      window.__timelines["campo"] = tl;
    })();
  </script>
