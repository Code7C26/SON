#cloud-config
# Se pega en Hetzner, en "Cloud config" (User data), al crear el servidor (Ubuntu 24.04).
# Deja el servidor listo: Docker, firewall, actualizaciones de seguridad y copia de seguridad diaria.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - fail2ban
  - unattended-upgrades
write_files:
  - path: /etc/cron.d/son-backup
    permissions: '0644'
    content: |
      # Copia de seguridad de SON todos los días a las 3 de la madrugada
      0 3 * * * root [ -x /opt/son/backup.sh ] && /opt/son/backup.sh >> /var/log/son-backup.log 2>&1
runcmd:
  - systemctl enable --now docker
  - systemctl enable --now fail2ban
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /opt/son/datos
  - touch /var/lib/son-listo
