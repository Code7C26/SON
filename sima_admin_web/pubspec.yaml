name: sima_admin_web
description: Panel de administracion web para SIMA.
publish_to: 'none'
version: 1.0.0+1


environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0



flutter:
  uses-material-design: true
  
  assets:
    - assets/images/LOGO1.png
    - assets/images/LOGO2.png
    
  fonts:
    - family: TuFuente
      fonts:
        - asset: assets/fonts/BwGradualDEMO-Regular.otf